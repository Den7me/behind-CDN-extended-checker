# File: .github/workflows/docker-build.yml
name: Docker Build & Push

on:
  push:
    tags:
      - 'v*.*.*'      # Trigger on version tags
    branches:
      - main
  workflow_dispatch:   # Allow manual run

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg BASE_IMAGE=alpine:3.20 \
            -t den7me/behind-cdn-extended-checker:${GITHUB_REF##*/} \
            -t den7me/behind-cdn-extended-checker:latest .

      - name: Push Docker image
        run: |
          docker push den7me/behind-cdn-extended-checker:${GITHUB_REF##*/}
          docker push den7me/behind-cdn-extended-checker:latest

